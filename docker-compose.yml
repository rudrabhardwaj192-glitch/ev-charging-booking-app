version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ev-postgres

    restart: always

    environment:
      POSTGRES_DB: evcharging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Rudra@123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  ev-charging-app:
    build: .
    container_name: ev-charging-app

    depends_on:
      - postgres

    ports:
      - "5000:5000"

    env_file:
      - .env

    restart: unless-stopped

volumes:
  postgres_data: